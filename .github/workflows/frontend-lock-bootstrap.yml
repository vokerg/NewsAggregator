name: One-time frontend dependency bootstrap

on:
  push:
    branches: [feat/issue-1-angular-foundation]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/feat/issue-1-angular-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install and format
        run: |
          npm install --no-audit --no-fund
          npm run format
      - name: Commit lockfile and formatted sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json angular.json tsconfig*.json eslint.config.mjs src public
          if ! git diff --cached --quiet; then
            git commit -m 'chore(frontend): lock dependencies and format scaffold (#1)'
            git push origin HEAD:refs/heads/feat/issue-1-angular-foundation
          fi
