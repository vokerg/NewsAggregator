name: Frontend checks

on:
  pull_request:
  push:
    branches: [main, feat/issue-1-angular-foundation]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Formatter diagnostic
        if: failure()
        run: |
          npx prettier --write src/app/app.routes.spec.ts src/app/features/news-feed/news-card.html
          git --no-pager diff -- src/app/app.routes.spec.ts src/app/features/news-feed/news-card.html
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Production build for GitHub Pages subpath
        run: npm run build:pages
      - name: Check generated base URL and static fixture
        shell: bash
        run: |
          test -f dist/news-aggregator/browser/index.html
          grep -q '<base href="/NewsAggregator/">' dist/news-aggregator/browser/index.html
          test -f dist/news-aggregator/browser/catalog/manifest.json
          python -m json.tool dist/news-aggregator/browser/catalog/manifest.json >/dev/null
