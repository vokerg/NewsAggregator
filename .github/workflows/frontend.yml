name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: |
          npm run format
          echo FORMAT_PATCH_START
          git diff -- src public
          echo FORMAT_PATCH_END
          npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Production build for GitHub Pages subpath
        run: npm run build:pages
      - name: Check generated base URL and static fixture
        shell: bash
        run: |
          test -f dist/news-aggregator/browser/index.html
          grep -q '<base href="/NewsAggregator/">' dist/news-aggregator/browser/index.html
          test -f dist/news-aggregator/browser/catalog/manifest.json
          python -m json.tool dist/news-aggregator/browser/catalog/manifest.json >/dev/null
          for detail in public/catalog/items/*.json; do
            cmp "$detail" "dist/news-aggregator/browser/${detail#public/}"
            python -m json.tool "$detail" >/dev/null
          done

      - name: Pre-merge browser review on built project subpath
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/reader-browser-smoke"
          mkdir -p "$smoke_dir/host/NewsAggregator"
          cp -a dist/news-aggregator/browser/. "$smoke_dir/host/NewsAggregator/"
          npm install --prefix "$smoke_dir" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          python -m http.server 8765 --bind 127.0.0.1 --directory "$smoke_dir/host" >/tmp/reader-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/NewsAggregator/ >/dev/null; then break; fi
            sleep 1
          done
          cat > "$smoke_dir/smoke.cjs" <<'JS'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ channel: "chrome", headless: true });
            try {
              const base = "http://127.0.0.1:8765/NewsAggregator/";
              for (const width of [320, 375, 768, 1024, 1440]) {
                const page = await browser.newPage({ viewport: { width, height: 900 } });
                const errors = [];
                page.on("pageerror", (error) => errors.push(error.message));
                const noOverflow = async () => {
                  const dimensions = await page.evaluate(() => ({
                    width: document.documentElement.clientWidth,
                    scroll: document.documentElement.scrollWidth,
                  }));
                  assert.ok(dimensions.scroll <= dimensions.width + 1, JSON.stringify(dimensions));
                };
                await page.goto(base + "#/news");
                await page.getByRole("heading", { name: "Latest news" }).waitFor();
                await page.getByText("2 articles", { exact: true }).waitFor();
                assert.equal(await page.getByRole("link", { name: "Open original", exact: false }).count(), 2);
                await noOverflow();
                await page.keyboard.press("Tab");
                assert.equal(await page.evaluate(() => document.activeElement.textContent.trim()), "Skip to content");
                await page.keyboard.press("Enter");
                assert.equal(await page.evaluate(() => document.activeElement.id), "main-content");
                await page.getByRole("link", { name: "Illustrative international story covered by a Danish publisher" }).click();
                await page.getByText("This is an invented example article", { exact: false }).waitFor();
                assert.equal(await page.locator(".original-link").getAttribute("href"), "https://example.org/demo/danish-report");
                await noOverflow();
                await page.reload();
                await page.getByText("This is an invented example article", { exact: false }).waitFor();
                await page.goto(base + "#/news/demo-moldovan-002");
                await page.getByRole("heading", { name: "Article text not publicly available" }).waitFor();
                assert.equal(await page.locator(".original-link").getAttribute("href"), "https://example.org/demo/economy-report");
                await noOverflow();
                await page.route("**/catalog/items/demo-danish-001.json", route => route.fulfill({ status: 503, body: "offline" }));
                await page.goto(base + "#/news/demo-danish-001");
                await page.getByRole("heading", { name: "Could not load article text" }).waitFor();
                assert.equal(await page.locator(".original-link").getAttribute("href"), "https://example.org/demo/danish-report");
                await page.unroute("**/catalog/items/demo-danish-001.json");
                await page.getByRole("button", { name: "Retry loading" }).click();
                await page.getByText("This is an invented example article", { exact: false }).waitFor();
                assert.deepEqual(errors, []);
                console.log("BROWSER_SMOKE_PASS viewport=" + width + "px: feed, keyboard skip, detail, reload, unavailable, body-error retry, no horizontal overflow");
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          node "$smoke_dir/smoke.cjs"
