name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate canonical formatting (temporary)
        run: |
          npm run format
          node -e 'const fs=require("node:fs"); const files=["src/app/core/data-access/static-news-repository.spec.ts","src/app/core/data-access/static-news-repository.ts","src/app/core/models/catalog-index.spec.ts","src/app/core/models/catalog-index.ts","src/app/core/models/news.ts","src/app/features/news-feed/news-feed.page.html","src/app/features/news-feed/news-feed.page.ts"]; console.log("FORMATTED_FILES="+JSON.stringify(files.map(path=>({path,content:fs.readFileSync(path,"utf8")}))))'

      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Production build for GitHub Pages subpath
        run: npm run build:pages
      - name: Check generated base URL and static fixture
        shell: bash
        run: |
          test -f dist/news-aggregator/browser/index.html
          grep -q '<base href="/NewsAggregator/">' dist/news-aggregator/browser/index.html
          test -f dist/news-aggregator/browser/catalog/manifest.json
          python -m json.tool dist/news-aggregator/browser/catalog/manifest.json >/dev/null
          for detail in public/catalog/items/*.json; do
            cmp "$detail" "dist/news-aggregator/browser/${detail#public/}"
            python -m json.tool "$detail" >/dev/null
          done
