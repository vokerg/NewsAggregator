name: One-time Angular review formatter

on:
  push:
    branches: [feat/issue-1-angular-foundation]

permissions:
  contents: write

jobs:
  format-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit only formatted source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ package.json angular.json tsconfig*.json eslint.config.mjs public/
          if ! git diff --cached --quiet; then
            git commit -m 'style(frontend): apply Prettier after pre-merge review'
            git push origin HEAD:refs/heads/feat/issue-1-angular-foundation
          fi
