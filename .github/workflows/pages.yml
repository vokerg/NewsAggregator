name: Build and deploy static NewsAggregator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public metadata from committed collection
        shell: bash
        run: |
          if test -f data/public/items.ndjson; then
            status=()
            if test -f data/public/status.json; then
              status=(--status data/public/status.json)
            fi
            python -m newsagg.publish --archive data/public/items.ndjson --registry config/sources.json "${status[@]}" --output public/catalog
          else
            echo "No committed public dataset; retaining explicitly labelled synthetic demo."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build:pages
      - name: Verify Pages project subpath and catalog
        shell: bash
        run: |
          test -f dist/news-aggregator/browser/index.html
          grep -q '<base href="/NewsAggregator/">' dist/news-aggregator/browser/index.html
          python -m json.tool dist/news-aggregator/browser/catalog/manifest.json >/dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/news-aggregator/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
